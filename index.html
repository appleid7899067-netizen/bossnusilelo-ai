<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Bossnu Codex</title>
<script src="https://js.puter.com/v2/"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b14;--panel:#0f1524;--card:#161d2f;--line:rgba(99,102,241,.22);
  --accent:#7c5cff;--accent2:#22d3ee;--text:#e8eefc;--muted:#8b97b3;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column}
.top{
  height:56px;display:flex;align-items:center;gap:.75rem;padding:0 1rem;
  border-bottom:1px solid var(--line);background:rgba(15,21,36,.9);backdrop-filter:blur(10px);
}
.logo{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:.45rem}
.logo b{color:var(--accent2)}
.pill{font-size:.68rem;padding:.2rem .55rem;border-radius:999px;background:rgba(124,92,255,.18);color:#c4b5fd}
.spacer{flex:1}
.status{font-size:.75rem;color:#34d399;display:flex;align-items:center;gap:.35rem}
.dot{width:7px;height:7px;border-radius:50%;background:#34d399}
.room{flex:1;display:flex;flex-direction:column;min-height:0;max-width:820px;width:100%;margin:0 auto}
.msgs{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.85rem}
.bubble{max-width:92%;padding:.9rem 1rem;border-radius:1rem;line-height:1.55;font-size:.93rem;white-space:pre-wrap;word-break:break-word}
.bubble.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:.3rem}
.bubble.user{align-self:flex-end;background:linear-gradient(135deg,#6d28d9,#4f46e5);border-bottom-right-radius:.3rem}
.bubble .meta{margin-top:.45rem;font-size:.68rem;opacity:.65}
.composer{
  padding:.75rem 1rem 1rem;border-top:1px solid var(--line);background:rgba(15,21,36,.85);
}
.box{
  display:flex;gap:.5rem;align-items:flex-end;background:var(--card);
  border:1px solid var(--line);border-radius:1rem;padding:.4rem .45rem .4rem .8rem;
}
.box textarea{
  flex:1;background:transparent;border:none;outline:none;color:var(--text);
  resize:none;min-height:24px;max-height:110px;font:inherit;line-height:1.4;padding:.35rem 0;
}
.send{
  width:42px;height:42px;border:none;border-radius:50%;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),#6366f1);color:#fff;font-size:1.05rem;
}
.send:disabled{opacity:.45;cursor:not-allowed}
.hint{margin-top:.45rem;font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between}
.typing{align-self:flex-start;padding:.65rem .9rem;border-radius:.9rem;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
  <header class="top">
    <div class="logo">👑 Bossnu <b>Codex</b></div>
    <span class="pill">ห้องแชทใหม่</span>
    <div class="spacer"></div>
    <div class="status"><span class="dot"></span><span id="st">พร้อม</span></div>
  </header>

  <div class="room">
    <div class="msgs" id="msgs">
      <div class="bubble bot">สวัสดีครับ ห้องแชท <b>Bossnu Codex</b> พร้อมแล้ว<br>ใช้โมเดลฟรีผ่าน Puter ทั้งระบบ พิมพ์คำถามได้เลยครับ<div class="meta">ระบบพร้อม · เลือกโมเดลอัตโนมัติ</div></div>
    </div>
    <div class="composer">
      <div class="box">
        <textarea id="q" rows="1" placeholder="พิมพ์ข้อความในห้องนี้..."></textarea>
        <button class="send" id="go" title="ส่ง">➤</button>
      </div>
      <div class="hint"><span>Enter ส่ง · Shift+Enter ขึ้นบรรทัดใหม่</span><span id="model">Puter free</span></div>
    </div>
  </div>

<script>
const MODELS=[
  "google/gemma-4-31b-it:free",
  "google/gemma-4-26b-a4b-it:free",
  "meta-llama/llama-3.3-70b-instruct:free",
  "nvidia/nemotron-3.5-lightning:free",
  "nex-agi/nex-n2.5-mini:free"
];
const msgs=document.getElementById("msgs");
const q=document.getElementById("q");
const go=document.getElementById("go");
const st=document.getElementById("st");
const modelEl=document.getElementById("model");
let history=[{role:"system",content:"คุณคือ Bossnu Codex ผู้ช่วย AI ตอบเป็นภาษาไทย สุภาพ ชัดเจน ตรงประเด็น ใส่ markdown ได้เมื่อจำเป็น"}];

function add(role,text,meta=""){
  const d=document.createElement("div");
  d.className="bubble "+role;
  d.innerHTML=text+(meta?`<div class="meta">${meta}</div>`:"");
  msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;
}

async function send(){
  const t=q.value.trim();if(!t)return;
  q.value="";q.style.height="auto";
  add("user",t.replace(/</g,"<"));
  history.push({role:"user",content:t});
  go.disabled=true;st.textContent="กำลังคิด...";
  const typing=document.createElement("div");typing.className="typing";typing.textContent="กำลังคิด...";msgs.appendChild(typing);msgs.scrollTop=msgs.scrollHeight;

  let reply=null,used=null;
  for(let i=0;i<MODELS.length;i++){
    const m=MODELS[i];
    modelEl.textContent=m.split("/").pop();
    try{
      const r=await puter.ai.chat(history,{model:m});
      reply=typeof r==="string"?r:(r?.message?.content||r?.text||JSON.stringify(r));
      used=m;break;
    }catch(e){console.warn(m,e);await new Promise(r=>setTimeout(r,200+i*100));}
  }
  typing.remove();
  if(reply){
    const safe=reply.replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">").replace(/\n/g,"<br>");
    add("bot",safe,(used||"").split("/").pop());
    history.push({role:"assistant",content:reply});
  }else{
    add("bot","โมเดลฟรีติดปัญหาชั่วคราว ลองใหม่อีกครั้งนะครับ");
  }
  go.disabled=false;st.textContent="พร้อม";q.focus();
}

go.onclick=send;
q.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}
});
q.addEventListener("input",()=>{q.style.height="auto";q.style.height=Math.min(q.scrollHeight,110)+"px";});
</script>
</body>
</html>
